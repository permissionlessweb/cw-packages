[package]
name = "cw-test-migrated"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
publish = false
description = "This contract used for testing migration from cw-blob with predictable address"

[lib]
crate-type = ["cdylib", "rlib"]

# Daemon test requires local juno to be running, after that use `cargo test --test daemon`
[[test]]
name = "daemon"
test = false

[dependencies]
cosmwasm-std = { workspace = true }
cosmwasm-schema = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-daemon = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-blob = { git = "https://github.com/permissionlessweb/cw-packages", branch = "zk-mvp" }
cw-orch-clone-testing = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }

[dev-dependencies]
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
cw-storage-plus = { workspace = true }
